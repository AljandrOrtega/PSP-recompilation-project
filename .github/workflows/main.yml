name: Build PSP Recompilation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown toml

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-mesa
            mingw-w64-ucrt-x86_64-sdl3

      - name: Download juego.elf & symbols.sym
        run: |
          mkdir -p build/mygame
          # Descargar juego.elf en ./
          python -m gdown "1I-KyrF5wsIlYSjudIkYoVjMOq7R9W-q4" -O juego.elf
          # Descargar symbols.sym en ./build/mygame/
          python -m gdown "1qTsWPpo7A8SS-QQT0gtKV2wk9EqTTgue" -O build/mygame/symbols.sym

      - name: Run Recompilation Pipeline & Compile
        shell: msys2 {0}
        run: |
          # 1. Generar la imagen binaria de memoria
          python tools/prxload.py juego.elf 0x08804000 --out=build/mygame/mygame_image.bin

          # 2. Generar el código C re-compilado desde el ELF y symbols.sym
          python tools/codegen.py juego.elf build/mygame/mygame_recomp.c --base=0x08804000

          # 3. Generar la lista de importaciones HLE
          python tools/imports.py juego.elf 0x08804000 --toml=build/mygame/mygame_imports.toml

          # 4. Compilar el ejecutable final usando el Makefile del proyecto
          mingw32-make compile GAME_NAME=mygame GAME_ELF=juego.elf GAME_BASE=0x08804000

      - name: Upload Recompiled Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mygame-windows-recompilation
          path: |
            build/mygame/mygame.exe
            build/mygame/mygame_image.bin
            build/mygame/mygame_imports.toml
            build/mygame/stubs.txt
